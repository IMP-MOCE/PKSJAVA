name: parking

services:
  backend:
    profiles: [web]
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: jdbc:postgresql://db:5432/pksjava
      DB_USER: pks_app
      JAVA_TOOL_OPTIONS: -Duser.timezone=Europe/Moscow
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pksjava
      POSTGRES_USER: pks_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Запустите через run.cmd}
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - parking_data:/var/lib/postgresql
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pks_app -d pksjava"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  parking_data:
