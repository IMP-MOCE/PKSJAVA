spring:
  application:
    name: parking-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/pksjava}
    username: ${DB_USER:pks_app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${APP_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
app:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: parking
    access-minutes: 15
    refresh-days: 14
  bootstrap:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    name: Администратор парковки
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}
  cookie-secure: ${COOKIE_SECURE:false}
  permanent-delete-enabled: ${PERMANENT_DELETE_ENABLED:true}
  import-limits:
    max-rows: 1000
