<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Импорт CSV')}"></head>
<body>
<div th:replace="~{layout :: page('import', ~{::section})}">
<section>
  <h1>Импорт CSV</h1>
  <div class="panel import-panel">
    <p>CSV в UTF-8 с запятой в качестве разделителя. Теги разделяются символом |. До 1000 строк и 5 МБ</p>
    <p class="code-example">code,employeeEmail,spot,date,status,purpose,guest,tags</p>
    <form method="post" enctype="multipart/form-data" th:action="@{/import/preview}">
      <label>CSV-файл<input name="file" type="file" accept=".csv,text/csv" required></label>
      <label>Режим<select name="mode">
        <option value="NEW_ONLY">Только новые брони</option>
        <option value="UPSERT">Добавить и обновить по номеру брони</option>
      </select></label>
      <button class="primary">Проверить файл</button>
    </form>
    <div th:if="${preview}">
      <p th:text="${'Корректных строк: ' + preview.validRows + ', ошибок: ' + preview.invalidRows}"></p>
      <p class="hint">Проверка действует 15 минут</p>
      <ul th:unless="${preview.errors.isEmpty()}">
        <li th:each="error : ${preview.errors}" th:text="${'Строка ' + error.row + ': ' + error.message}"></li>
      </ul>
      <form th:if="${preview.validRows > 0}" method="post" th:action="@{/import/apply}">
        <input type="hidden" name="previewId" th:value="${preview.previewId}">
        <button class="primary">Применить корректные строки</button>
      </form>
    </div>
    <div th:if="${applied}">
      <p th:text="${'Импорт завершён. Сохранено: ' + applied.successful}"></p>
      <ul th:unless="${applied.errors.isEmpty()}">
        <li th:each="error : ${applied.errors}" th:text="${'Строка ' + error.row + ': ' + error.message}"></li>
      </ul>
    </div>
  </div>
</section>
</div>
</body>
</html>
