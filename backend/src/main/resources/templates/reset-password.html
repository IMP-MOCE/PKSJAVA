<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Сброс пароля')}"></head>
<body>
<div th:replace="~{layout :: page('users', ~{::section})}">
<section>
  <h1 th:text="${'Сброс пароля · ' + editedUser.displayName}"></h1>
  <form class="panel editor-form" method="post" th:action="@{/admin/users/{id}/reset(id=${editedUser.id})}">
    <p>При следующем входе пользователь должен сменить временный пароль</p>
    <label>Временный пароль<input name="temporaryPassword" type="password" required minlength="12" maxlength="128" autocomplete="new-password"></label>
    <div class="dialog-actions"><a class="button-link" th:href="@{/admin/users}">Отмена</a><button class="primary">Сбросить пароль</button></div>
  </form>
</section>
</div>
</body>
</html>
