<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Пользователи')}"></head>
<body>
<div th:replace="~{layout :: page('users', ~{::section})}">
<section>
  <div class="page-heading">
    <h1>Пользователи</h1>
    <a class="button-link primary" th:href="@{/admin/users/new}">Добавить пользователя</a>
  </div>
  <div class="panel table-wrap">
    <table>
      <thead><tr><th>Пользователь</th><th>Роли</th><th>Доступ</th><th>Действия</th></tr></thead>
      <tbody>
        <tr th:each="account : ${result.content}">
          <td><strong th:text="${account.displayName}"></strong><small th:text="${account.email}"></small></td>
          <td><span class="badge" th:each="role : ${account.roles}" th:text="${roleLabels[role.name()]}"></span></td>
          <td>
            <span th:text="${account.enabled} ? 'Активен' : 'Отключён'"></span>
            <small th:if="${account.passwordChangeRequired}">Требуется смена пароля</small>
          </td>
          <td class="row-actions">
            <a th:href="@{/admin/users/{id}/edit(id=${account.id})}">Изменить</a>
            <a th:href="@{/admin/users/{id}/reset(id=${account.id})}">Сбросить пароль</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <nav class="pagination" th:if="${result.totalPages > 0}" aria-label="Страницы пользователей">
    <span th:text="${'Страница ' + (result.number + 1) + ' из ' + result.totalPages}"></span>
    <a class="button-link" th:unless="${result.first}" th:href="@{/admin/users(page=${result.number - 1})}">Назад</a>
    <a class="button-link" th:unless="${result.last}" th:href="@{/admin/users(page=${result.number + 1})}">Далее</a>
  </nav>
</section>
</div>
</body>
</html>
