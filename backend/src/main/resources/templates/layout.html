<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title + ' · Корпоративная парковка'}">Корпоративная парковка</title>
  <link rel="stylesheet" th:href="@{/styles.css}">
  <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
</head>
<body>
<div th:fragment="page(section, content)">
  <header class="topbar">
    <a class="brand" th:href="@{/}"><span class="brand-mark">P</span><strong>Корпоративная парковка</strong></a>
    <div class="account">
      <span th:text="${user.displayName}"></span>
      <a th:href="@{/password}">Сменить пароль</a>
      <form method="post" th:action="@{/logout}"><button>Выйти</button></form>
    </div>
  </header>
  <div class="workspace">
    <aside>
      <nav aria-label="Основная навигация">
        <a th:href="@{/bookings}" th:classappend="${section == 'bookings'} ? 'active'">Бронирования</a>
        <a th:href="@{/employees}" th:classappend="${section == 'employees'} ? 'active'">Сотрудники</a>
        <a th:href="@{/analytics}" th:classappend="${section == 'analytics'} ? 'active'">Обзор парковки</a>
        <a th:if="${canEdit}" th:href="@{/import}" th:classappend="${section == 'import'} ? 'active'">Импорт CSV</a>
        <a th:if="${admin}" th:href="@{/admin/users}" th:classappend="${section == 'users'} ? 'active'">Пользователи</a>
        <a th:if="${admin}" th:href="@{/admin/audit}" th:classappend="${section == 'audit'} ? 'active'">Журнал действий</a>
        <a th:if="${admin}" th:href="@{/swagger-ui.html}">Swagger</a>
      </nav>
    </aside>
    <main>
      <p class="notice" role="status" th:if="${message}" th:text="${message}"></p>
      <th:block th:replace="${content}"></th:block>
    </main>
  </div>
</div>
</body>
</html>
