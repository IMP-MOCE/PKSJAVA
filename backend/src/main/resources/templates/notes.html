<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Заметки')}"></head>
<body>
<div th:replace="~{layout :: page('bookings', ~{::section})}">
<section>
  <div class="page-heading">
    <h1 th:text="${'Заметки · ' + booking.code}"></h1>
    <a class="button-link" th:href="@{/bookings(archived=${booking.archived})}">К бронированиям</a>
  </div>
  <p class="muted" th:if="${notes.isEmpty()}">Заметок пока нет</p>
  <article class="note" th:each="note : ${notes}" th:classappend="${note.pinned} ? 'pinned'">
    <small th:text="${note.authorName + ' · ' + #temporals.format(note.createdAt, 'dd.MM.yyyy HH:mm', 'Europe/Moscow') + (note.pinned ? ' · закреплена' : '')}"></small>
    <p th:text="${note.body}"></p>
    <div class="row-actions" th:if="${canEdit and (admin or user.id == note.authorId)}">
      <a th:href="@{/bookings/{id}/notes(id=${booking.id},edit=${note.id})}">Изменить</a>
      <form method="post" th:action="@{/bookings/{id}/notes/{noteId}/delete(id=${booking.id},noteId=${note.id})}">
        <button class="danger">Удалить</button>
      </form>
    </div>
  </article>
  <form class="panel editor-form" th:if="${canEdit}" method="post" th:action="@{/bookings/{id}/notes(id=${booking.id})}">
    <h2 th:text="${editing == null} ? 'Новая заметка' : 'Изменить заметку'"></h2>
    <input th:if="${editing != null}" type="hidden" name="noteId" th:value="${editing.id}">
    <input type="hidden" name="version" th:value="${editing == null ? 0 : editing.version}">
    <label>Текст<textarea name="body" required maxlength="4000" rows="5" th:text="${editing?.body}"></textarea></label>
    <label class="checkbox"><input type="hidden" name="_pinned" value="on"><input type="checkbox" name="pinned" value="true" th:checked="${editing != null and editing.pinned}">Закрепить</label>
    <div class="dialog-actions">
      <a th:if="${editing}" class="button-link" th:href="@{/bookings/{id}/notes(id=${booking.id})}">Отмена</a>
      <button class="primary">Сохранить заметку</button>
    </div>
  </form>
</section>
</div>
</body>
</html>
