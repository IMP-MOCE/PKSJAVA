<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Смена пароля')}"></head>
<body>
<section class="login-card">
  <h1 th:text="${user.passwordChangeRequired} ? 'Замените временный пароль' : 'Смена пароля'"></h1>
  <p class="muted">От 12 символов: заглавная и строчная буквы, цифра и специальный символ</p>
  <form method="post" th:action="${user.passwordChangeRequired} ? @{/password/initial} : @{/password}">
    <label th:unless="${user.passwordChangeRequired}">Текущий пароль
      <input name="currentPassword" type="password" required maxlength="128" autocomplete="current-password">
    </label>
    <label>Новый пароль
      <input name="newPassword" type="password" required minlength="12" maxlength="128" autocomplete="new-password">
    </label>
    <button class="primary">Сохранить пароль</button>
    <a th:unless="${user.passwordChangeRequired}" th:href="@{/bookings}">К бронированиям</a>
  </form>
  <form th:if="${user.passwordChangeRequired}" method="post" th:action="@{/logout}"><button>Выйти</button></form>
</section>
</body>
</html>
