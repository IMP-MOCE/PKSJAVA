<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Вход')}"></head>
<body>
<section class="login-card">
  <div class="brand-mark">P</div>
  <h1>Корпоративная парковка</h1>
  <p class="form-error" role="alert" th:if="${param.error}">Не удалось войти. Проверьте почту и пароль</p>
  <p class="notice" role="status" th:if="${param.changed}">Пароль изменён. Войдите с новым паролем</p>
  <p class="notice" role="status" th:if="${param.logout}">Вы вышли из системы</p>
  <form method="post" th:action="@{/login}">
    <label>Почта<input name="email" type="email" required maxlength="254" autocomplete="username"></label>
    <label>Пароль<input name="password" type="password" required maxlength="128" autocomplete="current-password"></label>
    <button class="primary">Войти</button>
  </form>
</section>
</body>
</html>
